<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dashboard – Studie Persönlichkeit & Stress</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 40px auto;
            max-width: 1100px;
            line-height: 1.6;
        }
        h1, h2 { margin-bottom: 0.5em; }

        .section {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px 24px;
            margin-bottom: 28px;
        }
        button, a.button {
            padding: 10px 18px;
            border-radius: 6px;
            border: 1px solid #444;
            background:#222;color:#fff;
            text-decoration:none;cursor:pointer;
        }

        table { width:100%; border-collapse:collapse; margin-top:15px; }
        th, td { border-bottom:1px solid #ddd; padding:6px; text-align:left; }
        th { font-weight:bold; }
        .small-info { color:#777; font-size:0.85em; }
    </style>
</head>
<body>

<h1> Dashboard – Persönlichkeit & Stress Studie</h1>

<div class="section">
    <h2>1. Datenübersicht</h2>
    <p class="small-info">
        Live-Dateneinsicht – inkl. Big Five, Stresswerten & Studieninformationen
    </p>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Session</th>
            <th>Studiengang</th>
            <th>Semester</th>
            <th>E · A · C · N · O</th>
            <th>PSS</th>
            <th>Datum</th>
        </tr>
        </thead>

        <tbody id="dataset-body">
        <tr><td colspan="7">Noch keine Daten geladen</td></tr>
        </tbody>
    </table>
</div>

<div class="section">
    <h2>2. Datenexport</h2>
    <a href="/api/export/csv" class="button">CSV Standard</a>
    <a href="/api/export/scientific" class="button">CSV Scientific</a>
    <a href="/api/export/json" class="button">JSON Export</a>
</div>

<script>
    /*  LIVE-DATEN-LADER */
    async function loadData() {
        const res = await fetch("/api/export/json", { credentials:"include" });

        if(!res.ok){
            document.getElementById("dataset-body").innerHTML =
                `<tr><td colspan="7"> Zugriff verweigert oder keine Daten</td></tr>`;
            return;
        }

        const data = await res.json();
        const body = document.getElementById("dataset-body");
        body.innerHTML="";

        if(data.length === 0){
            body.innerHTML = `<tr><td colspan="7"> Noch keine Teilnehmer gespeichert</td></tr>`;
            return;
        }

        data.forEach(r=>{
            const row = document.createElement("tr");
            row.innerHTML = `
            <td>${r.id}</td>
            <td>${r.sessionId}</td>
            <td>${r.studyProgram || "?"}</td>
            <td>${r.semester || "-"}</td>
            <td>E:${r.extraversion} · A:${r.agreeableness} · C:${r.conscientiousness} · N:${r.neuroticism} · O:${r.openness}</td>
            <td>${r.pssTotal} (${r.pssHelplessness}+${r.pssSelfEfficacyReversed})</td>
            <td>${r.timestamp ? r.timestamp.substring(0,19).replace("T"," ") : "-"}</td>
        `;
            body.appendChild(row);
        });
    }

    loadData();
</script>
</body>
</html>
