# RAILWAY PRODUCTION

# Railway PostgreSQL - direkte Service-Referenzen
spring.datasource.url=${Postgres-zVo9.DATABASE_URL}
spring.datasource.username=${Postgres-zVo9.PGUSER}
spring.datasource.password=${Postgres-zVo9.PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Admin credentials von Railway Umgebungsvariablen
ADMIN_USER=${ADMIN_USER}
ADMIN_PASS=${ADMIN_PASS}

# H2 Console deaktivieren
spring.h2.console.enabled=false

# Railway Port
server.port=${PORT:8080}