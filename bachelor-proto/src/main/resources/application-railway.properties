

# RAILWAY PRODUCTION

# Railway PostgreSQL - TCP Proxy mit Credentials in URL
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?user=${PGUSER}&password=${PGPASSWORD}&sslmode=disable
spring.datasource.driver-class-name=org.postgresql.Driver

# KEINE separaten username/password Properties mehr!

# JPA/Hibernate Konfiguration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Admin credentials von Railway Umgebungsvariablen
ADMIN_USER=${ADMIN_USER}
ADMIN_PASS=${ADMIN_PASS}

# H2 Console deaktivieren
spring.h2.console.enabled=false

# Railway Port
server.port=${PORT:8080}